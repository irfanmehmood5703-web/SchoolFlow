<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d33">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://schoolflow-phase1.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>SchoolFlow</title>
  <link rel="stylesheet" href="start.css">
  <script src="start.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>SchoolFlow</div>
    <h1 id="title">Opening SchoolFlow</h1>
    <p class="status" id="status" role="status" aria-atomic="true">Getting your school workspace ready.</p>
    <div class="progress" id="progress" role="progressbar" aria-label="Connecting to SchoolFlow" hidden><span></span></div>
    <button id="retry" type="button" hidden>Try again</button>
    <noscript>
      <p>Continue to SchoolFlow to open your workspace.</p>
      <a class="button" href="https://schoolflow-phase1.onrender.com/">Open SchoolFlow</a>
      <a class="button" href="https://schoolflow-phase1.onrender.com/auth/institute">School sign in</a>
      <a class="button" href="https://schoolflow-phase1.onrender.com/vendor/login">Software owner</a>
    </noscript>
  </main>
</body>
</html>
