<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d33">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://schoolflow-phase1.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="application-name" content="InstituteAxis">
  <meta name="description" content="Complete Education Management System">
  <link rel="icon" type="image/svg+xml" href="instituteaxis-mark.svg">
  <title>InstituteAxis</title>
  <link rel="stylesheet" href="start.css">
  <script src="start.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <div class="brand"><img src="instituteaxis-mark.svg" alt="" width="30" height="30">InstituteAxis</div>
    <h1 id="title">Opening InstituteAxis</h1>
    <p class="status" id="status" role="status" aria-atomic="true">Getting your school workspace ready.</p>
    <div class="progress" id="progress" role="progressbar" aria-label="Connecting to InstituteAxis" hidden><span></span></div>
    <button id="retry" type="button" hidden>Try again</button>
    <noscript>
      <p>Continue to InstituteAxis to open your workspace.</p>
      <a class="button" href="https://schoolflow-phase1.onrender.com/">Open InstituteAxis</a>
      <a class="button" href="https://schoolflow-phase1.onrender.com/auth/institute">School sign in</a>
      <a class="button" href="https://schoolflow-phase1.onrender.com/vendor/login">Software owner</a>
    </noscript>
  </main>
</body>
</html>
