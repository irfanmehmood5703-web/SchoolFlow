<!doctype html>
<html lang="en" data-reopen="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d33">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="application-name" content="InstituteAxis">
  <meta name="description" content="Complete Education Management System">
  <link rel="icon" type="image/svg+xml" href="/static/instituteaxis-mark.svg">
  <title>Opening InstituteAxis</title>
  <link rel="stylesheet" href="/opening/start.css">
  <script src="/opening/start.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <div class="brand"><img src="/static/instituteaxis-mark.svg" alt="" width="30" height="30">InstituteAxis</div>
    <h1 id="title">Opening InstituteAxis</h1>
    <p class="status" id="status" role="status" aria-atomic="true">Getting your school workspace ready.</p>
    <div class="progress" id="progress" role="progressbar" aria-label="Connecting to InstituteAxis" hidden><span></span></div>
    <button id="retry" type="button" hidden>Try again</button>
    <noscript><p><a class="button" href="/auth/institute">Open school sign in</a></p></noscript>
  </main>
</body>
</html>
