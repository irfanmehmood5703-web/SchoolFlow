plugins { id 'com.android.application' }
import groovy.json.JsonSlurper

def schoolFile=providers.gradleProperty('schoolBrandingFile').orNull
def school=schoolFile ? new JsonSlurper().parse(new File(schoolFile),'UTF-8') : null
if (school && (!(school.school_key ==~ /[0-9a-f]{32}/) || !(school.code ==~ /[A-Z0-9][A-Z0-9-]{2,39}/) || school.name.size()<1 || school.name.size()>80)) throw new GradleException('Invalid school branding')
def resourceText={ value -> '"'+value.replace('\\','\\\\').replace('"','\\"').replace("'","\\'")+'"' }

android {
    namespace 'com.schoolflow.clients'
    compileSdk 35
    defaultConfig { applicationId 'com.schoolflow.clients'; minSdk 26; targetSdk 35; versionCode 10; versionName '0.10-acceptance' }
    sourceSets.main.java.srcDir rootProject.file('../android-common/src/main/java')
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String','INSTITUTE_CODE',school ? '"'+school.code+'"' : '""'
        buildConfigField 'String','SCHOOL_SCOPE',school ? '"'+school.school_key+'"' : '""'
        manifestPlaceholders=[launcherIcon:school ? '@mipmap/school_launcher' : '@drawable/instituteaxis_icon', launcherLabel:'@string/app_name']
        if(school){ versionCode (school.sequence as int); versionName '0.3-school-test.'+school.sequence }
    }
    if(school){
        sourceSets.main.res.srcDir rootProject.file('generated-school-res')
        signingConfigs { schoolKey {
            storeFile file(providers.gradleProperty('schoolSigningFile').get())
            storeType 'PKCS12'; storePassword System.getenv('SCHOOLFLOW_KEYSTORE_PASSWORD')
            keyAlias 'schoolflow'; keyPassword System.getenv('SCHOOLFLOW_KEYSTORE_PASSWORD')
        } }
    }
    flavorDimensions += 'role'
    productFlavors {
        parents { dimension 'role'; applicationId 'com.schoolflow.parents'; buildConfigField 'String', 'ROLE', '"parents"'; resValue 'string','app_name','InstituteAxis Parent' }
        teacher { dimension 'role'; applicationId 'com.schoolflow.teacher'; buildConfigField 'String', 'ROLE', '"teacher"'; resValue 'string','app_name','InstituteAxis Teacher' }
        owner { dimension 'role'; applicationId 'com.schoolflow.owner'; buildConfigField 'String', 'ROLE', '"owner"'; resValue 'string','app_name','InstituteAxis Owner' }
        qr {
            dimension 'role'
            applicationId 'com.schoolflow.qr'
            buildConfigField 'String', 'ROLE', '"qr"'
            resValue 'string', 'app_name', 'InstituteAxis QR Attendance'
            resValue 'string', 'qr_scan_prompt', resourceText(school ? "Scan QR card · ${school.name}" : 'Scan a InstituteAxis QR card')
        }
        sms { dimension 'role'; applicationId 'com.schoolflow.sms'; buildConfigField 'String', 'ROLE', '"sms"'; resValue 'string','app_name','InstituteAxis SMS' }
    }
    if(school){ productFlavors.all { flavor ->
        def names=[parents:'Parents',teacher:'Teacher',owner:'Owner',sms:'SMS',qr:'QR Attendance']
        flavor.applicationId='com.schoolflow.schools.s'+school.school_key+'.'+flavor.name
        flavor.resValue 'string','app_name',resourceText(school.name+' '+names[flavor.name])
        def label=school.launcher_labels?.get(flavor.name)
        if (label) {
            flavor.resValue 'string','launcher_name',resourceText(label)
            flavor.manifestPlaceholders = [launcherLabel:'@string/launcher_name']
        }
    } }
    buildTypes { debug { applicationIdSuffix '.test'; if(school) { debuggable false; signingConfig signingConfigs.schoolKey } }; acceptance { initWith debug; applicationIdSuffix '.acceptance'; matchingFallbacks=['debug'] }
        release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    qrImplementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing's camera permission code uses AndroidX Core at runtime.
    qrImplementation 'androidx.core:core:1.13.1'
}
