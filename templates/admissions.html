{% extends 'base.html' %}{% block content %}<h1>Admissions</h1><div class="panel"><h2>New Admission</h2><form method="post" class="grid"><input name="admission_no" placeholder="Admission No" required><input name="name" placeholder="Student Name" required><input name="father" placeholder="Father / Guardian"><input name="class_name" placeholder="Class"><input name="phone" placeholder="Phone"><button>Save Admission</button></form></div><div class="panel"><h2>Student Records</h2><div class="table"><table><tr><th>Adm No</th><th>Name</th><th>Guardian</th><th>Class</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r.admission_no}}</td><td>{{r.name}}</td><td>{{r.father or '-'}}</td><td>{{r.class_name or '-'}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
