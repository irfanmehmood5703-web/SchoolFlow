<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · SchoolFlow</title><link rel="stylesheet" href="{{asset_url('style.css')}}"></head><body><main><div class="page-content"><header class="page-heading"><div><p class="eyebrow">SchoolFlow Parent Portal</p><h1>{{school.name}}</h1></div><a href="{{url_for('parent_portal.home',code=school.code)}}">My children</a></header>{% with flashes=get_flashed_messages(with_categories=true) %}{% for category,message in flashes %}<p role="status" class="flash {{category}}">{{message}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></main></body></html>
