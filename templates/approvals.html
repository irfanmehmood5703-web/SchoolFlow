{% extends 'base.html' %}{% import 'ops_macros.html' as m with context %}{% block content %}{{m.heading(title)}}<form method="post" action="/workspace/approve-students" class="form-card">{{m.csrf()}}<button name="action" value="approve" data-needs-selection>Approve selected</button> <button name="action" value="reject" data-needs-selection>Reject selected</button><table><tr><th>Select</th><th>SID</th><th>Student</th><th>Class</th></tr>{% for row in rows %}<tr><td><input type="checkbox" name="ids" value="{{row.id}}"></td><td>{{row.id}}</td><td>{{row.name}}</td><td>{{row.class_name}}</td></tr>{% else %}<tr><td colspan="4">No admissions awaiting approval.</td></tr>{% endfor %}</table></form>{% endblock %}
