{% extends 'base.html' %}{% block content %}<h1>HRM</h1><div class="panel"><h2>Add Employee</h2><form method="post" class="grid"><input name="employee_no" placeholder="Employee ID" required><input name="name" placeholder="Employee Name" required><input name="role" placeholder="Designation / Role"><input name="phone" placeholder="Phone"><input name="salary" type="number" step=".01" placeholder="Basic Salary"><button>Add Employee</button></form></div><div class="panel"><h2>Employees</h2><div class="table"><table><tr><th>ID</th><th>Name</th><th>Role</th><th>Phone</th><th>Salary</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r.employee_no}}</td><td>{{r.name}}</td><td>{{r.role or '-'}}</td><td>{{r.phone or '-'}}</td><td>{{'%.0f'|format(r.salary)}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
