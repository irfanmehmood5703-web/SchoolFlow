<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · SchoolFlow</title><style>body{margin:0;background:#edf4ef;color:#173b2b}.print-toolbar{padding:18px;background:white;font:15px Arial,sans-serif;position:relative;z-index:1}.print-toolbar button,.print-toolbar a{margin-right:14px}.issued-document{margin:20px auto;background:white;max-width:210mm;padding:10mm;box-sizing:border-box;contain:layout paint}.reference-label{font:12px Arial,sans-serif;color:#486454}@media print{@page{size:A4;margin:10mm}body{background:white}.print-toolbar,.reference-label{display:none}.issued-document{margin:0;padding:0;break-after:page;max-width:none}.issued-document:last-child{break-after:auto}.certificate-sheet{break-after:auto!important}}.issued-document:has(.certificate-sheet.card){max-width:210mm;padding:9mm 12mm}.issued-document .certificate-sheet.card{max-width:178mm!important;padding:4mm!important;font-size:12px!important;line-height:1.45}.issued-document .certificate-sheet.card article>table{width:100%!important;min-height:86mm;border-collapse:separate;border-spacing:3mm 0}.issued-document .certificate-sheet.card article>table>tbody>tr>td{width:50%!important;vertical-align:top;padding:0!important;border:1px solid #d7e4dc;border-radius:8px;overflow:hidden}.issued-document .certificate-sheet.card article>table>tbody>tr>td>table{width:100%!important;min-height:86mm}.issued-document .certificate-sheet.card article>table>tbody>tr>td>table td{padding:5mm 3mm!important;border:0!important}.issued-document .certificate-sheet.card h3{font-size:15px!important;line-height:1.25;margin:6px 0}.issued-document .certificate-sheet.card p{font-size:11px!important;line-height:1.4;margin:6px 0}.issued-document .certificate-sheet.card img[alt="Student photo"]{width:25mm!important;height:29mm!important;max-width:none!important;object-fit:cover!important;border:2px solid #fff;border-radius:5px}.issued-document .certificate-sheet.card img[alt="School logo"]{width:16mm!important;height:16mm!important;max-width:none!important;object-fit:contain!important}.issued-document .certificate-sheet.card img[alt="Student QR code"]{width:25mm!important;height:25mm!important;max-width:none!important;object-fit:contain!important}@media print{.issued-document:has(.certificate-sheet.card){padding:0!important}.issued-document .certificate-sheet.card{padding:0!important;break-inside:avoid}.issued-document .certificate-sheet.card article>table{break-inside:avoid}.issued-document .certificate-sheet.card article>table>tbody>tr>td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}/* Professional double-frame student ID card: also styles previously issued snapshots. */
.issued-document .certificate-sheet.card article>table>tbody>tr>td{position:relative!important;border:2px solid #176b4a!important;border-radius:9px!important;outline:1px solid #a4c9b6!important;outline-offset:-5px!important;background:#fff!important;box-shadow:0 2px 8px rgba(16,65,43,.10)!important;overflow:hidden!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child{border-top:6px solid #176b4a!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:last-child{border-top:6px solid #254d3a!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td>table{background:#fff!important;color:#183b2c!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td>table td{background:#fff!important;color:#183b2c!important;padding:6mm 3mm!important}
.issued-document .certificate-sheet.card h3{color:#176b4a!important;font-size:15px!important;font-weight:800!important;letter-spacing:.2px!important}
.issued-document .certificate-sheet.card p{color:#244735!important;font-size:11px!important;opacity:1!important}
.issued-document .certificate-sheet.card img[alt="Student photo"]{border:2px solid #176b4a!important;border-radius:6px!important;box-shadow:0 1px 5px rgba(0,0,0,.15)!important}
.issued-document .certificate-sheet.card img[alt="Student QR code"]{border:2px solid #d3e4da!important;border-radius:4px!important;padding:2px!important;background:#fff!important}
@media print{.issued-document .certificate-sheet.card article>table>tbody>tr>td,.issued-document .certificate-sheet.card article>table>tbody>tr>td>table,.issued-document .certificate-sheet.card article>table>tbody>tr>td>table td{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-shadow:none!important}.issued-document .certificate-sheet.card article>table>tbody>tr>td{outline:1px solid #a4c9b6!important}}

/* Final ID-card readability polish: clear identity hierarchy and balanced spacing. */
.issued-document .certificate-sheet.card article>table>tbody>tr>td>table td{padding:5mm 4mm!important;vertical-align:middle!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child h3:first-of-type{font-size:16px!important;line-height:1.25!important;margin:8px 0 10px!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child h3:nth-of-type(2){font-size:17px!important;line-height:1.3!important;margin:9px 0 5px!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:last-child h3{font-size:16px!important;letter-spacing:.7px!important;margin:5px 0 11px!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td p{font-size:12px!important;line-height:1.55!important;margin:7px 0!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child p:nth-last-of-type(2){font-weight:700!important;color:#155b40!important}
.issued-document .certificate-sheet.card img[alt="Student QR code"]{width:27mm!important;height:27mm!important}
@media print{.issued-document .certificate-sheet.card article>table>tbody>tr>td{break-inside:avoid!important}}

/* Branded ID card backgrounds: green front, soft green back, white readable labels. */
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child,
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child>table,
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child>table td{background:#176b4a!important;color:#fff!important}

.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child strong{color:#fff!important}

.issued-document .certificate-sheet.card article>table>tbody>tr>td:last-child h3,
.issued-document .certificate-sheet.card article>table>tbody>tr>td:last-child p{color:#153d2b!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:first-child img[alt="School logo"]{background:#fff!important;border-radius:5px!important;padding:3px!important}
.issued-document .certificate-sheet.card article>table>tbody>tr>td:last-child img[alt="Student QR code"]{background:#fff!important;padding:5px!important}
@media print{
 .issued-document .certificate-sheet.card article>table>tbody>tr>td,
 .issued-document .certificate-sheet.card article>table>tbody>tr>td>table,
 .issued-document .certificate-sheet.card article>table>tbody>tr>td>table td{
 -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style></head><body><nav class="print-toolbar"><button onclick="window.print()">Print / Save PDF</button><a href="{{url_for('certificates.index',tab='logs')}}">Certificate Logs</a><span>{{issues|length}} generated document{{'s' if issues|length>1 else ''}}. Reprinting preserves the issued reference.</span></nav>{% for issue in issues %}<div class="issued-document"><p class="reference-label">{{issue.reference}} · {{issue.document_name}} · {{issue.student_name}}</p>{{issue.html|safe}}</div>{% endfor %}</body></html>
