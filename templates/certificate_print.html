<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · SchoolFlow</title><style>body{margin:0;background:#edf4ef;color:#173b2b}.print-toolbar{padding:18px;background:white;font:15px Arial,sans-serif;position:relative;z-index:1}.print-toolbar button,.print-toolbar a{margin-right:14px}.issued-document{margin:20px auto;background:white;max-width:210mm;padding:10mm;box-sizing:border-box;contain:layout paint}.reference-label{font:12px Arial,sans-serif;color:#486454}@media print{@page{size:A4;margin:10mm}body{background:white}.print-toolbar,.reference-label{display:none}.issued-document{margin:0;padding:0;break-after:page;max-width:none}.issued-document:last-child{break-after:auto}.certificate-sheet{break-after:auto!important}}.issued-document:has(.certificate-sheet.card){max-width:210mm;padding:9mm 12mm}.issued-document .certificate-sheet.card{max-width:178mm!important;padding:4mm!important;font-size:12px!important;line-height:1.45}.issued-document .certificate-sheet.card article>table{width:100%!important;min-height:86mm;border-collapse:separate;border-spacing:3mm 0}.issued-document .certificate-sheet.card article>table>tbody>tr>td{width:50%!important;vertical-align:top;padding:0!important;border:1px solid #d7e4dc;border-radius:8px;overflow:hidden}.issued-document .certificate-sheet.card article>table>tbody>tr>td>table{width:100%!important;min-height:86mm}.issued-document .certificate-sheet.card article>table>tbody>tr>td>table td{padding:5mm 3mm!important;border:0!important}.issued-document .certificate-sheet.card h3{font-size:15px!important;line-height:1.25;margin:6px 0}.issued-document .certificate-sheet.card p{font-size:11px!important;line-height:1.4;margin:6px 0}.issued-document .certificate-sheet.card img[alt="Student photo"]{width:25mm!important;height:29mm!important;max-width:none!important;object-fit:cover!important;border:2px solid #fff;border-radius:5px}.issued-document .certificate-sheet.card img[alt="School logo"]{width:16mm!important;height:16mm!important;max-width:none!important;object-fit:contain!important}.issued-document .certificate-sheet.card img[alt="Student QR code"]{width:25mm!important;height:25mm!important;max-width:none!important;object-fit:contain!important}@media print{.issued-document:has(.certificate-sheet.card){padding:0!important}.issued-document .certificate-sheet.card{padding:0!important;break-inside:avoid}.issued-document .certificate-sheet.card article>table{break-inside:avoid}.issued-document .certificate-sheet.card article>table>tbody>tr>td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><nav class="print-toolbar"><button onclick="window.print()">Print / Save PDF</button><a href="{{url_for('certificates.index',tab='logs')}}">Certificate Logs</a><span>{{issues|length}} generated document{{'s' if issues|length>1 else ''}}. Reprinting preserves the issued reference.</span></nav>{% for issue in issues %}<div class="issued-document"><p class="reference-label">{{issue.reference}} · {{issue.document_name}} · {{issue.student_name}}</p>{{issue.html|safe}}</div>{% endfor %}</body></html>
