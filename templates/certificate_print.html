<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · SchoolFlow</title><style>body{margin:0;background:#edf4ef;color:#173b2b}.print-toolbar{padding:18px;background:white;font:15px Arial,sans-serif;position:relative;z-index:1}.print-toolbar button,.print-toolbar a{margin-right:14px}.issued-document{margin:20px auto;background:white;max-width:210mm;padding:10mm;box-sizing:border-box;contain:layout paint}.reference-label{font:12px Arial,sans-serif;color:#486454}@media print{@page{size:A4;margin:10mm}body{background:white}.print-toolbar,.reference-label{display:none}.issued-document{margin:0;padding:0;break-after:page;max-width:none}.issued-document:last-child{break-after:auto}.certificate-sheet{break-after:auto!important}}</style></head><body><nav class="print-toolbar"><button onclick="window.print()">Print / Save PDF</button><a href="{{url_for('certificates.index',tab='logs')}}">Certificate Logs</a><span>{{issues|length}} generated document{{'s' if issues|length>1 else ''}}. Reprinting preserves the issued reference.</span></nav>{% for issue in issues %}<div class="issued-document"><p class="reference-label">{{issue.reference}} · {{issue.document_name}} · {{issue.student_name}}</p>{{issue.html|safe}}</div>{% endfor %}</body></html>
