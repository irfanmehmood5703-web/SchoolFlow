{% extends 'base.html' %}{% import 'ops_macros.html' as m with context %}{% block content %}{{m.heading(title,'Print uses the selected employee’s saved record.')}}<form method="get" class="form-card filter-grid"><div class="field"><label for="employee_id">Employee</label><select id="employee_id" name="employee_id" required><option value="">Choose employee</option>{% for e in employees %}<option value="{{e.id}}" {{'selected' if person and person.id==e.id else ''}}>{{e.name}} · {{e.employee_no}}</option>{% endfor %}</select></div><button>Preview employee document</button></form>{% if sections %}<article class="form-card result-card">{{sections.header}}{{sections.body}}{{sections.footer}}</article>{% endif %}{% endblock %}
