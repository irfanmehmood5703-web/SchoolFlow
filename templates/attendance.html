{% extends 'base.html' %}{% block content %}<h1>Attendance</h1><div class="panel"><h2>Mark Attendance</h2><form method="post" class="grid"><select name="student_id" required><option value="">Select student</option>{% for s in students %}<option value="{{s.id}}">{{s.admission_no}} — {{s.name}}</option>{% endfor %}</select><select name="status"><option>Present</option><option>Absent</option><option>Leave</option><option>Late</option></select><button>Mark Attendance</button></form></div><div class="panel"><h2>Recent Attendance</h2><div class="table"><table><tr><th>Date</th><th>Student</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r.day}}</td><td>{{r.student.name}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
