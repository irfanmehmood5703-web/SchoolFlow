<style>.certificate-sheet{box-sizing:border-box;width:100%;max-width:190mm;margin:0 auto;padding:8mm;color:#18392b;background:white;font:14px/1.6 Arial,sans-serif;overflow-wrap:anywhere;contain:layout paint}.certificate-sheet *{box-sizing:border-box}.certificate-sheet table{border-collapse:collapse;max-width:100%}.certificate-sheet td,.certificate-sheet th{padding:8px;border:1px solid #dce8e1}.certificate-sheet p{margin:12px 0}.certificate-sheet img{max-width:100%;object-fit:contain}.certificate-sheet h1{font-size:24px;margin:24px 0}.certificate-sheet h2{font-size:20px}.certificate-sheet hr{margin:20px 0;border:0;border-top:1px solid #a9cabc}.certificate-sheet.card{max-width:120mm;padding:4mm;font-size:10px}.certificate-sheet.card h3{font-size:12px}.certificate-sheet.card td{padding:4px}.certificate-sheet.card hr{page-break-after:auto}.certificate-sheet.label{max-width:120mm;font-size:12px}@media print{.certificate-sheet{break-after:page;max-width:190mm}.certificate-sheet.card{max-width:120mm;padding:4mm;font-size:10px}.certificate-sheet.card h3{font-size:12px}.certificate-sheet.card td{padding:4px}.certificate-sheet.label{max-width:120mm}}</style>
<section class="certificate-sheet {{layout}}"><header>{{sections.header|safe}}</header><article>{{sections.body|safe}}</article><footer style="margin-top:24px">{{sections.footer|safe}}</footer></section>
