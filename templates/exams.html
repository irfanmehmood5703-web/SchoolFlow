{% extends 'base.html' %}{% block content %}<h1>Exams</h1><div class="panel"><h2>Enter Result</h2><form method="post" class="grid"><select name="student_id" required><option value="">Select student</option>{% for s in students %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><input name="exam" placeholder="Exam / Term" required><input name="subject" placeholder="Subject" required><input name="total" type="number" step=".01" value="100" required><input name="obtained" type="number" step=".01" placeholder="Obtained" required><button>Save Result</button></form></div><div class="panel"><h2>Results</h2><div class="table"><table><tr><th>Student</th><th>Exam</th><th>Subject</th><th>Marks</th><th>%</th></tr>{% for r in rows %}<tr><td>{{r.student.name}}</td><td>{{r.exam}}</td><td>{{r.subject}}</td><td>{{r.obtained}} / {{r.total}}</td><td>{{'%.1f'|format((r.obtained/r.total*100) if r.total else 0)}}%</td></tr>{% endfor %}</table></div></div>{% endblock %}
