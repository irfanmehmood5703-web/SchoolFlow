name: SchoolFlow Android Clients
on:
  push:
    branches: [main, feature/connected-android-clients]
    paths: ['mobile/clients/**', '.github/workflows/clients-android.yml', 'sms_gateway.py', 'sms_batches.py', 'mobile_clients.py', 'identity.py', 'operations.py', 'student_fee_plans.py', 'school_clock.py', 'tests/**', 'owner_app.py', 'widget_sources.py', 'templates/owner_app.html', 'static/owner-*', 'scripts/*owner_app*', 'parents.py', 'parent_app.py', 'parent_study.py', 'templates/parent*.html', 'templates/message_parent_base.html', 'static/parent-app.*', 'scripts/*parent_app*']
  pull_request:
    paths: ['mobile/clients/**', '.github/workflows/clients-android.yml', 'sms_gateway.py', 'sms_batches.py', 'mobile_clients.py', 'identity.py', 'operations.py', 'student_fee_plans.py', 'school_clock.py', 'tests/**', 'owner_app.py', 'widget_sources.py', 'templates/owner_app.html', 'static/owner-*', 'scripts/*owner_app*', 'parents.py', 'parent_app.py', 'parent_study.py', 'templates/parent*.html', 'templates/message_parent_base.html', 'static/parent-app.*', 'scripts/*parent_app*']
permissions:
  contents: read
concurrency:
  group: schoolflow-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with: {gradle-version: '8.9', cache-disabled: true}
      - name: Test, lint and compile all four clients
        working-directory: mobile/clients
        run: gradle --no-daemon :app:testParentsAcceptanceUnitTest :app:lintParentsAcceptance :app:assembleParentsAcceptance :app:testTeacherAcceptanceUnitTest :app:lintTeacherAcceptance :app:assembleTeacherAcceptance :app:testOwnerAcceptanceUnitTest :app:lintOwnerAcceptance :app:assembleOwnerAcceptance :app:testSmsAcceptanceUnitTest :app:lintSmsAcceptance :app:assembleSmsAcceptance
      - name: Package installable test clients
        working-directory: mobile/clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for role in parents teacher owner sms; do
            cp "app/build/outputs/apk/$role/acceptance/app-$role-acceptance.apk" "dist/SchoolFlow-$role-test.apk"
          done
          (cd dist && sha256sum *.apk >SHA256SUMS.txt)
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" >dist/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with: {name: SchoolFlow-Android-clients-test, path: 'mobile/clients/dist/', retention-days: 14}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: SchoolFlow-Android-clients-reports, path: 'mobile/clients/app/build/reports/', retention-days: 14}
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python -X faulthandler -W ignore -m unittest discover -s tests -q
  owner-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Verify Owner App at phone and desktop widths with private fictional schools
        env:
          SCHOOLFLOW_UI_QA: '1'
          SCHOOLFLOW_PLAYWRIGHT_MODULE: /tmp/schoolflow-browser/node_modules/playwright
        run: |
          npm install --prefix /tmp/schoolflow-browser --no-save playwright@1.62.1
          /tmp/schoolflow-browser/node_modules/.bin/playwright install --with-deps chromium
          python scripts/owner_app_ui_server.py > /tmp/owner-ui-server.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5057/healthz > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_owner_app.cjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: SchoolFlow-Owner-App-UI, path: '/tmp/owner-app-ui/', retention-days: 14}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with: {name: SchoolFlow-Owner-App-UI-log, path: '/tmp/owner-ui-server.log', retention-days: 7}
  parent-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Verify Parent App with a private fictional family at phone and desktop widths
        env:
          SCHOOLFLOW_UI_QA: '1'
          SCHOOLFLOW_PLAYWRIGHT_MODULE: /tmp/schoolflow-browser/node_modules/playwright
        run: |
          npm install --prefix /tmp/schoolflow-browser --no-save playwright@1.62.1
          /tmp/schoolflow-browser/node_modules/.bin/playwright install --with-deps chromium
          python scripts/parent_app_ui_server.py > /tmp/parent-ui-server.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5058/healthz > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_parent_app.cjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: SchoolFlow-Parent-App-UI, path: '/tmp/parent-app-ui/', retention-days: 14}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with: {name: SchoolFlow-Parent-App-UI-log, path: '/tmp/parent-ui-server.log', retention-days: 7}
  publish-test-apks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, backend, owner-ui, parent-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: SchoolFlow-Android-clients-test, path: clients/}
      - name: Publish verified test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(cat clients/SOURCE-COMMIT.txt)" = "$GITHUB_SHA"
          (cd clients && sha256sum -c SHA256SUMS.txt)
          gh release create "clients-test-${{ github.run_number }}" clients/*.apk clients/SHA256SUMS.txt clients/SOURCE-COMMIT.txt --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title "SchoolFlow Android clients — test build" --notes "Parents, Teacher and Owner are native Android portal clients using existing live web workflows and permissions. SMS is an attended native school-SIM client with an explicitly started foreground queue with configurable 15/20/25-second spacing and a durable no-automatic-resend outbox. Debug-signed test APKs, not Play Store or production releases. No credentials or school records bundled. Physical Android/SIM testing and production owner-controlled signing remain required. SMS consumes the phone's SIM package; no paid service provisioned."
