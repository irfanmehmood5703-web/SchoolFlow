name: Private account panel
on:
  push:
    branches: [main, feature/challan-add-amount, feature/private-account-panel, feature/shareholder-workflows, feature/parent-result-connection, feature/diary-ptm-forms, feature/challan-bank-photo-qr, feature/how-to-guides, feature/internal-messages, feature/assistant-support-notifications, feature/guide-only, feature/system-audit, feature/native-acceptance, feature/owner-security, feature/catalog-session-cleanup]
    paths: ['challan_amounts.py', 'static/challan_amounts.*', 'tests/test_challan_amounts.py', 'scripts/test_challan_amounts.cjs', 'school_clock.py', 'reports.py', 'records.py', 'templates/ops_macros.html', 'templates/register.html', 'templates/readiness.html', 'templates/roll_numbers.html', 'templates/base.html', 'operations.py', 'tests/test_system_audit.py', 'tests/test_catalog_options.py', 'templates/record_settings.html', 'tests/test_security_headers.py', 'workspace_actor.py', 'assistant_service.py', 'support_desk.py', 'personal_notices.py', 'templates/assistant*.html', 'templates/support.html', 'templates/workspace_tools.html', 'templates/notifications_page.html', 'static/workspace_tools.*', 'static/support.js', 'tests/test_workspace_tools.py', 'messaging.py', 'messaging_files.py', 'templates/message*.html', 'templates/internal_messages.html', 'static/messages.*', 'tests/test_messaging.py', 'requirements.txt', 'how_to.py', 'how_to_content.py', 'templates/how_to*.html', 'static/how_to.css', 'tests/test_how_to.py', 'challan_branding.py', 'templates/challan*.html', 'static/challan.css', 'tests/test_challan_branding.py', 'tests/test_staff_access.py', 'scripts/reference_forms_ui_server.py', 'scripts/test_reference_forms.cjs', 'diary_work.py', 'ptm_groups.py', 'ptm.py', 'student_extras.py', 'staff_access.py', 'templates/ptm*.html', 'templates/student_extras.html', 'static/diary-work.js', 'static/ptm-groups.js', 'tests/test_diary_work.py', 'tests/test_ptm_groups.py', 'parents.py', 'parent_app.py', 'parent_study.py', 'templates/parent*.html', 'static/parent-app.*', 'tests/test_parent_app.py', 'school_settings.py', 'templates/exam_results.html', 'templates/parent_portal.html', 'tests/test_parent_exam_results.py', 'finance_partners.py', 'shareholder_posting.py', 'templates/shareholder*.html', 'tests/test_shareholder_posting.py', 'vendor_admin.py', 'identity.py', 'app.py', 'school_apps.py', 'client_subscription.py', 'templates/vendor_*.html', 'tests/test_vendor_admin.py', 'scripts/verify_private_storage.py', '.github/workflows/private-accounts.yml']
  pull_request:
    paths: ['parent_app.py', 'parent_study.py', 'tests/test_parent_app.py', 'templates/parent*.html', 'static/parent-app.*', '.github/workflows/private-accounts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Audit resolved application dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
      - name: Complete backend suite on isolated SQLite
        env:
          IDENTITY_DATABASE_URL: ''
          SCHOOLFLOW_PRIVATE_STORAGE_QA: ''
        run: python -X faulthandler -W ignore -m unittest discover -s tests -q
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: private_account_qa
          POSTGRES_USER: fictional_qa
          POSTGRES_PASSWORD: fictional_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fictional_qa -d private_account_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTITY_DATABASE_URL: postgresql://fictional_qa:fictional_ci_password@localhost:5432/private_account_qa
      SCHOOLFLOW_PRIVATE_STORAGE_QA: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Vendor and real-school access on durable PostgreSQL
        run: python -W ignore -m unittest discover -s tests -p test_vendor_admin.py -q
      - name: Existing identity and cross-school regressions on PostgreSQL
        run: python -W ignore -m unittest discover -s tests -p test_identity.py -q
      - name: Owner summaries and preference isolation on PostgreSQL
        run: python -W ignore -m unittest discover -s tests -p test_owner_app.py -q
      - name: School APK queue on separate control database
        run: python -W ignore -m unittest discover -s tests -p test_school_apps.py -q
      - name: Shareholder accounting and tenant isolation
        run: python -W ignore -m unittest discover -s tests -p test_shareholder_posting.py -q
      - name: Family summaries, requests and study publication on PostgreSQL
        run: python -W ignore -m unittest discover -s tests -p test_parent_app.py -q
      - name: Published family-scoped parent exam results
        run: python -W ignore -m unittest discover -s tests -p test_parent_exam_results.py -q
      - name: Subject diary files and parent access
        run: python -W ignore -m unittest discover -s tests -p test_diary_work.py -q
      - name: Class PTM and event preferences
        run: python -W ignore -m unittest discover -s tests -p test_ptm_groups.py -q
      - name: Bank, photo and reference QR challan printing
        run: python -W ignore -m unittest discover -s tests -p test_challan_branding.py -q
      - name: Internal chat, family isolation, policies, audio and exports
        run: python -W ignore -m unittest discover -s tests -p test_messaging.py -q
      - name: Assistant, central support and private notifications
        run: python -W ignore -m unittest discover -s tests -p test_workspace_tools.py -q
      - name: Full menu, inner forms, empty choices and private testing guidance
        run: python -W ignore -m unittest discover -s tests -p test_system_audit.py -q
      - name: Catalog session cleanup, school isolation and protected references
        run: python -W ignore -m unittest discover -s tests -p test_catalog_options.py -q
      - name: Reviewed generated-challan adjustments and exact-once confirmation
        run: python -W ignore -m unittest discover -s tests -p test_challan_amounts.py -q
      - name: How To menu coverage, reader, search and authentication
        run: python -W ignore -m unittest discover -s tests -p test_how_to.py -q
      - name: Staff scopes including private challan photos
        run: python -W ignore -m unittest discover -s tests -p test_staff_access.py -q
      - name: Verify account and school data survive a new application process
        run: python scripts/verify_private_storage.py

      - name: Mobile and desktop reference form browser checks
        env:
          SCHOOLFLOW_UI_QA: '1'
          SCHOOLFLOW_PLAYWRIGHT_MODULE: /tmp/schoolflow-browser/node_modules/playwright
        run: |
          npm install --prefix /tmp/schoolflow-browser --no-save playwright@1.62.1
          /tmp/schoolflow-browser/node_modules/.bin/playwright install --with-deps chromium
          python scripts/reference_forms_ui_server.py > /tmp/schoolflow-ui-server.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          node scripts/test_reference_forms.cjs
          node scripts/test_challan_amounts.cjs
      - name: Retain synthetic Add Amount UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: challan-amount-ui
          path: /tmp/challan-amount-ui/
          if-no-files-found: ignore
