name: Private account panel
on:
  push:
    branches: [main, feature/private-account-panel, feature/shareholder-workflows, feature/parent-result-connection, feature/diary-ptm-forms, feature/challan-bank-photo-qr]
    paths: ['challan_branding.py', 'templates/challan*.html', 'static/challan.css', 'tests/test_challan_branding.py', 'tests/test_staff_access.py', 'scripts/reference_forms_ui_server.py', 'scripts/test_reference_forms.cjs', 'diary_work.py', 'ptm_groups.py', 'ptm.py', 'student_extras.py', 'staff_access.py', 'templates/ptm*.html', 'templates/student_extras.html', 'static/diary-work.js', 'static/ptm-groups.js', 'tests/test_diary_work.py', 'tests/test_ptm_groups.py', 'parents.py', 'school_settings.py', 'templates/exam_results.html', 'templates/parent_portal.html', 'tests/test_parent_exam_results.py', 'finance_partners.py', 'shareholder_posting.py', 'templates/shareholder*.html', 'tests/test_shareholder_posting.py', 'vendor_admin.py', 'identity.py', 'app.py', 'school_apps.py', 'client_subscription.py', 'templates/vendor_*.html', 'tests/test_vendor_admin.py', 'scripts/verify_private_storage.py', '.github/workflows/private-accounts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: private_account_qa
          POSTGRES_USER: fictional_qa
          POSTGRES_PASSWORD: fictional_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fictional_qa -d private_account_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTITY_DATABASE_URL: postgresql://fictional_qa:fictional_ci_password@localhost:5432/private_account_qa
      SCHOOLFLOW_PRIVATE_STORAGE_QA: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Vendor and real-school access on durable PostgreSQL
        run: python -W ignore -m unittest discover -s tests -p test_vendor_admin.py -q
      - name: Existing identity and cross-school regressions on PostgreSQL
        run: python -W ignore -m unittest discover -s tests -p test_identity.py -q
      - name: School APK queue on separate control database
        run: python -W ignore -m unittest discover -s tests -p test_school_apps.py -q
      - name: Shareholder accounting and tenant isolation
        run: python -W ignore -m unittest discover -s tests -p test_shareholder_posting.py -q
      - name: Published family-scoped parent exam results
        run: python -W ignore -m unittest discover -s tests -p test_parent_exam_results.py -q
      - name: Subject diary files and parent access
        run: python -W ignore -m unittest discover -s tests -p test_diary_work.py -q
      - name: Class PTM and event preferences
        run: python -W ignore -m unittest discover -s tests -p test_ptm_groups.py -q
      - name: Bank, photo and reference QR challan printing
        run: python -W ignore -m unittest discover -s tests -p test_challan_branding.py -q
      - name: Staff scopes including private challan photos
        run: python -W ignore -m unittest discover -s tests -p test_staff_access.py -q
      - name: Verify account and school data survive a new application process
        run: python scripts/verify_private_storage.py

      - name: Mobile and desktop reference form browser checks
        env:
          SCHOOLFLOW_UI_QA: '1'
          SCHOOLFLOW_PLAYWRIGHT_MODULE: /tmp/schoolflow-browser/node_modules/playwright
        run: |
          npm install --prefix /tmp/schoolflow-browser --no-save playwright@1.62.1
          /tmp/schoolflow-browser/node_modules/.bin/playwright install --with-deps chromium
          python scripts/reference_forms_ui_server.py > /tmp/schoolflow-ui-server.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          node scripts/test_reference_forms.cjs
