name: Fee schedule scope UI
on:
  push:
    branches: [main, feature/fee-scope-checkboxes, feature/setup-map-checkboxes, feature/bulk-class-maps, feature/setup-save-feedback, feature/setup-all-tick-choices, feature/advanced-toggle-visibility]
    paths: ['static/style.css', 'scripts/test_advanced_toggle.cjs', 'scripts/setup_completion_ui_server.py', 'scripts/test_setup_completion.cjs', 'tests/test_institute_setup.py', 'tests/test_fee_setup.py', 'templates/institute_setup.html', 'institute_setup.py', 'scripts/test_setup_map_scope.cjs', 'templates/fee_schedules.html', 'static/fee_setup.js', 'static/fee_scope.css', 'fee_setup.py', 'requirements.txt', 'scripts/fee_scope_ui_server.py', 'scripts/test_fee_schedule_scope.cjs', '.github/workflows/fee-scope-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Existing fee setup and billing regressions
        env:
          IDENTITY_DATABASE_URL: ''
        run: python -W ignore -m unittest discover -s tests -p test_fee_setup.py -q
      - name: Existing institute setup and admission integration
        env:
          IDENTITY_DATABASE_URL: ''
        run: python -W ignore -m unittest discover -s tests -p test_institute_setup.py -q
      - name: Mobile and desktop explicit scope selection
        env:
          SCHOOLFLOW_UI_QA: '1'
          SCHOOLFLOW_PLAYWRIGHT_MODULE: /tmp/schoolflow-browser/node_modules/playwright
        run: |
          npm install --prefix /tmp/schoolflow-browser --no-save playwright@1.62.1
          /tmp/schoolflow-browser/node_modules/.bin/playwright install --with-deps chromium
          python scripts/fee_scope_ui_server.py > /tmp/sf-fee-scope-server.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          node scripts/test_fee_schedule_scope.cjs
          node scripts/test_setup_map_scope.cjs
          node scripts/test_advanced_toggle.cjs
          python scripts/setup_completion_ui_server.py > /tmp/sf-fee-scope-completion-server.log 2>&1 &
          completion_pid=$!
          trap 'kill "$qa_pid" "$completion_pid" 2>/dev/null || true' EXIT
          node scripts/test_setup_completion.cjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: fee-scope-browser-evidence
          retention-days: 3
          path: |
            /tmp/sf-fee-scope-*.png
            /tmp/sf-fee-scope-server.log
