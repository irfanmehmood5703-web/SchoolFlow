name: Result card print pagination
on:
  push:
    branches: [main]
    paths: ['templates/exam_results.html','static/style.css','school_settings.py','scripts/test_result_print.py','.github/workflows/result-print.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_result_print.py
