# Free testing only. User deferred all paid hosting until launch.
# Connect a Neon Free project first; supply its URL privately via Render env.
# This file never creates/upgrades a paid database or changes main.
services:
  - type: web
    name: schoolflow-gate-trial-irfan
    runtime: python
    region: singapore
    plan: free
    repo: https://github.com/irfanmehmood5703-web/SchoolFlow
    branch: feature/schoolflow-gate-android
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_gate_trial.py
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SCHOOLFLOW_REQUIRE_POSTGRES
        value: "1"
      # On-demand testing avoids keeping free serverless compute awake all day.
      - key: SCHOOLFLOW_FINE_WORKER
        value: "0"
